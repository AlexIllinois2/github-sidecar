[package]
name = "dev-sidecar-rs"
version = "0.1.0"
edition = "2021"
description = "Dev-sidecar rewritten in Rust: MITM-capable HTTP(S) proxy with DNS racing, github acceleration rules and a built-in web admin UI. Single static binary."
license = "MPL-2.0"

[[bin]]
name = "dev-sidecar-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["alloc"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dirs = "6"
open = "5"
sha2 = "0.10"
futures-util = "0.3"
time = "0.3"
bytes = "1"
tower-service = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
lto = "thin"
strip = true


[profile.dev]
debug = 0
